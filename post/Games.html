<!DOCTYPE html>
<!-- 默认设置 theme 为 light，后续靠 JS 改变它 -->
<html lang="zh-CN,en,default" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏</title>
  
  <!-- 引入你刚才写的 CSS -->
  
<link rel="stylesheet" href="/css/style.css">

  
  <!-- 提前注入 JS，防止暗黑模式闪屏 (FOUC) -->
  <script>
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
<meta name="generator" content="Hexo 8.1.1"></head>
<body>
  
  <header class="header">
    <div class="logo">
      <a href="/" style="color: white; font-weight: bold;">Singularity</a>
    </div>
    <nav class="nav-links">
      <!-- 这里使用了 i18n 翻译功能 -->
      <a href="/" style="color: white; margin-right: 15px;">首页</a>
      <a href="/archives" style="color: white; margin-right: 15px;">归档</a>
      
      <!-- 暗/亮色切换按钮 -->
      <button id="theme-toggle" style="cursor: pointer; background: none; border: 1px solid white; color: white; padding: 4px 8px; border-radius: 6px;">
        🌓 Toggle Theme
      </button>
    </nav>
  </header>

  <main style="max-width: 900px; margin: 30px auto; padding: 0 20px;">
    <!-- 这里的 body 就是 index.ejs, post.ejs 等子模板渲染的内容 -->
    
  </main>

  <footer style="text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid var(--color-border-default);">
    &copy; 2026 卢昱宏
  </footer>

  <!-- 引入暗黑模式切换逻辑 JS -->
  
<script src="/js/main.js"></script>

</body>
</html>
